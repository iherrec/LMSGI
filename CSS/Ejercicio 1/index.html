<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 de CSS</title>
    <style>
        .cta-container {
            
            background-image: url("images/backbround.webp");
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: scroll;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            
        }

        .cta-text {
            color: aliceblue;
            font-size: 28px;
            font-weight: bold
        }
        
        .cta-button {
            background-color: #626bb2;
            color:ghostwhite;
            padding: 15px 30px;
            border:none;
            border-radius: 15px;
            cursor:pointer;

        }
    </style>
</head>

<body>
<div class="cta-container">
 <h2 class="cta-text">¡Aprovecha nuestra oferta especial!</h2>
 <p  class="cta-text">Hasta un 40% de descuento en productos seleccionados.</p>
 <button class="cta-button">Descubrir Ofertas</button>
</div>
   
</body>
</html>
