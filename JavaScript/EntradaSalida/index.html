<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <label>Peso:</label>
    <input type="text" id="peso">
   
    <label>Altura:</label>
    <input type="text" id="altura">

    <button ondragleave="mostrarIMC()">Calcular</button>
        <p id ="respuesta"></p>
        <p id="rango"></p>

    <script>
        function mostrarIMC() {
            const peso = document.getElementById("peso");
            const altura = document.getElementById("altura");
            const respuesta = document.getElementById("respuesta");
            let imc = peso.value/(altura.value*altura.value);
            respuesta.textContent = imc;
            if (imc < 18.5) {
                rango.textContent = "Bajo peso"
            } else if (imc >= 18.5 && imc < 24.9) {
                rango.textContent = "Peso normal"
            } else if (imc >= 25 && imc < 29.9) {
                rango.textContent = "Sobrepeso"
            } else if (imc > 30) {
                rango.textContent = "Obesidad"
            }
        }
    </script>

</body>
